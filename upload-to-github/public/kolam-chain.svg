<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80" fill="none" stroke="#c0261f" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sikku kolam chain: two strands cross at every joint, making a chain of leaf-shaped loops with a dot in each.
       Every second loop grows a twisted side-loop (with its own dot). Tile repeats vertically with no seam. -->
  <g transform="translate(18 0)">
    <!-- strand 1: side-loop on the first leaf, then bulges left -->
    <path d="M 0 0 C 3 6, 8 13, 12 20 C 16 27, 24 31, 33 29 C 42 27, 43 13, 33 11 C 24 9, 16 13, 12 20 C 8 27, 3 34, 0 40 C -17.3 52, -17.3 68, 0 80"/>
    <!-- strand 2: bulges left on the first leaf, then right on the second -->
    <path d="M 0 0 C -17.3 12, -17.3 28, 0 40 C 17.3 52, 17.3 68, 0 80"/>
    <!-- dots -->
    <g fill="#c0261f" stroke="none">
      <circle cx="-0.5" cy="20" r="2.3"/>
      <circle cx="28.5" cy="20" r="2.3"/>
      <circle cx="0" cy="60" r="2.3"/>
    </g>
  </g>
</svg>
