# Render Blueprint: one click creates the PostgreSQL database and the website together.
# https://render.com/docs/blueprint-spec
databases:
  - name: craftcart-db
    databaseName: craftcart
    user: craftcart
    plan: free          # free databases on Render are temporary; upgrade the plan to keep your data long-term
    region: singapore   # closest to customers in India

services:
  - type: web
    name: craft-and-cart
    runtime: node
    plan: free          # free web services sleep after ~15 min idle and take ~30s to wake up
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    # Creates/updates the tables and products on every start (safe to repeat), then starts the site.
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: craftcart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false     # Render asks you for this when you create the Blueprint (min 10 characters)
