# Nginx server block for https://craft.jilljill.in  ->  Docker container on 127.0.0.1:3215
#
# This is a NEW file. It does not edit any of your existing sites.
#   sudo cp deploy/nginx/craft.jilljill.in.conf /etc/nginx/sites-available/craft.jilljill.in
#   sudo ln -s /etc/nginx/sites-available/craft.jilljill.in /etc/nginx/sites-enabled/craft.jilljill.in
#   sudo nginx -t && sudo systemctl reload nginx        # nginx -t must say "syntax is ok" BEFORE you reload
#
# First time only, get the certificate (adjust if you already use another method such as a wildcard certificate):
#   sudo certbot certonly --nginx -d craft.jilljill.in
# If you do not have a certificate yet, comment out the whole "listen 443" server block, reload, run certbot, then restore it.

server {
    listen 80;
    listen [::]:80;
    server_name craft.jilljill.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name craft.jilljill.in;

    ssl_certificate     /etc/letsencrypt/live/craft.jilljill.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craft.jilljill.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    # Basic hardening headers (the site is HTTPS-only)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Uncomment once you are sure HTTPS works for good:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3215;
        proxy_http_version 1.1;

        # The site sets "Secure" login cookies; it only needs the browser to be on HTTPS (it is, via this server block).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
